<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found | Arjun Rose J S</title>
  <meta name="theme-color" content="#1c2327">
  <!-- Self-contained on purpose: a 404 can be served from any depth, so it uses no relative paths. -->
  <style>
    :root { color-scheme: dark; --bg:#1c2327; --bg-2:#242d32; --ink:#eceee9; --ink-2:#b4bcb8; --line:#3a464c; --fault:#e5534b; --amber:#f2c200; --amber-ink:#14181a; --focus:#7cc4ff; }
    @media (prefers-color-scheme: light) { :root { color-scheme: light; --bg:#f1f2ee; --bg-2:#fff; --ink:#172025; --ink-2:#47535a; --line:#c4cbc6; --fault:#b3261e; --amber:#f2c200; --amber-ink:#14181a; --focus:#0b5cad; } }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { display: grid; place-items: center; min-height: 100vh; padding: 24px; background: var(--bg); color: var(--ink); font: 400 17px/1.55 ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .stripe { position: fixed; inset: 0 0 auto 0; height: 8px; background: repeating-linear-gradient(135deg, #2f9e50 0 12px, #f2c200 12px 24px); }
    .plate { width: min(100%, 560px); padding: 28px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 10px; }
    .status { display: flex; align-items: center; gap: 10px; margin: 0 0 14px; color: var(--ink-2); font-weight: 600; }
    .lamp { width: 12px; height: 12px; border-radius: 50%; background: var(--fault); box-shadow: 0 0 0 3px color-mix(in srgb, var(--fault) 28%, transparent); }
    h1 { margin: 0 0 12px; font-size: clamp(28px, 6vw, 40px); line-height: 1.1; letter-spacing: -0.02em; }
    p { margin: 0 0 22px; color: var(--ink-2); }
    a.btn { display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px; border-radius: 6px; background: var(--amber); color: var(--amber-ink); font-weight: 700; text-decoration: none; }
    a.btn:hover { filter: brightness(1.06); }
    a:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
  </style>
</head>
<body>
  <div class="stripe" aria-hidden="true"></div>
  <main class="plate">
    <h1>Nothing is wired to this address.</h1>
    <p class="status"><span class="lamp" aria-hidden="true"></span>Fault 404, address not mapped</p>
    <p>The link may be old or mistyped. This is the portfolio of Arjun&nbsp;Rose&nbsp;J&nbsp;S, a robotics and automation engineer. It is one page, and every section lives on it.</p>
    <a class="btn" href="https://arjunrose.github.io/Arjun_Rose_J_S/">Back to the cell</a>
  </main>
</body>
</html>
